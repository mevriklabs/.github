name: Reusable · Standard CI

# This workflow is reusable across every ax-* repository.
# Each repo's local .github/workflows/ci.yml calls this with the matrix of jobs it needs.
# Lives in mevriklabs/.github so a single edit propagates everywhere.

on:
  workflow_call:
    inputs:
      languages:
        description: "Languages present in the repo: comma-separated (go,python,typescript)"
        required: true
        type: string
      run-tenant-isolation-tests:
        description: "Run tenant_id + RLS isolation tests (ax-platform, ax-cortex)"
        required: false
        type: boolean
        default: false
      run-capability-matrix-check:
        description: "Run capability matrix snapshot check (ax-platform)"
        required: false
        type: boolean
        default: false
      coverage-threshold:
        description: "Minimum coverage % (default 80)"
        required: false
        type: number
        default: 80
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write    # OIDC to AWS

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Go
        if: contains(inputs.languages, 'go')
        uses: actions/setup-go@v5
        with: { go-version: '1.23' }

      - name: golangci-lint
        if: contains(inputs.languages, 'go')
        uses: golangci/golangci-lint-action@v6
        with: { version: 'v1.61' }

      - name: Set up Python
        if: contains(inputs.languages, 'python')
        uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: ruff + black
        if: contains(inputs.languages, 'python')
        run: |
          pip install ruff==0.6.* black==24.*
          ruff check .
          black --check .

      - name: Set up Node
        if: contains(inputs.languages, 'typescript')
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: ESLint + Prettier
        if: contains(inputs.languages, 'typescript')
        run: |
          npm ci
          npm run lint
          npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: contains(inputs.languages, 'go')
        uses: actions/setup-go@v5
        with: { go-version: '1.23' }

      - name: go vet
        if: contains(inputs.languages, 'go')
        run: go vet ./...

      - name: Set up Python
        if: contains(inputs.languages, 'python')
        uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: mypy
        if: contains(inputs.languages, 'python')
        run: |
          pip install mypy==1.11.*
          mypy --strict .

      - name: Set up Node
        if: contains(inputs.languages, 'typescript')
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: tsc
        if: contains(inputs.languages, 'typescript')
        run: |
          npm ci
          npx tsc --noEmit

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: contains(inputs.languages, 'go')
        uses: actions/setup-go@v5
        with: { go-version: '1.23' }

      - name: Go tests with coverage
        if: contains(inputs.languages, 'go')
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${coverage}%"
          awk -v cov="$coverage" -v thr="${{ inputs.coverage-threshold }}" 'BEGIN { exit (cov < thr) }' \
            || (echo "::error::Coverage ${coverage}% below threshold ${{ inputs.coverage-threshold }}%" && exit 1)

      - name: Set up Python
        if: contains(inputs.languages, 'python')
        uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: Python tests with coverage
        if: contains(inputs.languages, 'python')
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install -e .
          pytest --cov --cov-report=xml --cov-fail-under=${{ inputs.coverage-threshold }}

      - name: Node tests with coverage
        if: contains(inputs.languages, 'typescript')
        run: |
          npm ci
          npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  tenant-isolation:
    name: tenant-isolation
    if: inputs.run-tenant-isolation-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ax_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          # Each repo provides scripts/run-migrations.sh
          bash scripts/run-migrations.sh
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ax_test

      - name: Verify RLS active on every business table
        run: |
          # Fails if any table tagged `business=true` lacks a row-level security policy
          bash scripts/verify-rls.sh
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ax_test

      - name: Cross-tenant query smoke test
        run: |
          # Inserts data as tenant_a, queries as tenant_b — must return zero rows
          bash scripts/test-tenant-isolation.sh
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ax_test

  capability-matrix:
    name: capability-matrix
    if: inputs.run-capability-matrix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detect changes to capability matrix
        id: matrix
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^packages/capabilities/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Capability matrix changed — require label
        if: steps.matrix.outputs.changed == 'true'
        run: |
          # PRs that change the matrix must carry `matrix-change-approved` label.
          # Founder applies the label after explicit review (per CODEOWNERS).
          labels=$(gh pr view ${{ github.event.pull_request.number }} --json labels -q '.labels[].name')
          echo "$labels" | grep -q 'matrix-change-approved' \
            || (echo "::error::Capability matrix changed — needs 'matrix-change-approved' label from @princemojumder" && exit 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.languages }}

      - name: CodeQL autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  license-compliance:
    name: license-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for license-check helper)
        uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: Verify no incompatible licenses
        run: |
          pip install pip-licenses==5.*
          # Banned for inclusion: AGPL, SSPL, anything copyleft that would force us to open-source.
          # The list mirrors GitHub Plan §11.
          BANNED='AGPL-3.0|AGPL-3.0-or-later|SSPL-1.0|BUSL-1.1|CC-BY-NC-4.0'

          # Go
          if [ -f go.mod ]; then
            go install github.com/google/go-licenses@latest
            $HOME/go/bin/go-licenses check ./... \
              --disallowed_types=forbidden,restricted,unknown \
              || (echo "::error::Go dependency has incompatible license" && exit 1)
          fi

          # Python
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            [ -f requirements.txt ] && pip install -r requirements.txt
            [ -f pyproject.toml ]   && pip install -e .
            pip-licenses --format=json | python -c "
import json, re, sys
banned = re.compile(r'$BANNED')
data = json.load(sys.stdin)
bad = [p for p in data if banned.search(p.get('License',''))]
if bad:
    for p in bad: print(f'::error::{p[\"Name\"]} {p[\"Version\"]} → {p[\"License\"]}')
    sys.exit(1)
"
          fi

          # Node
          if [ -f package.json ]; then
            npx license-checker --excludePackages "$(jq -r .name package.json)" \
              --failOn 'AGPL-3.0;AGPL-3.0-or-later;SSPL-1.0;BUSL-1.1' \
              || (echo "::error::npm dependency has incompatible license" && exit 1)
          fi

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Dockerfile') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ax-image:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ax-image:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  # ------------------------------------------------------------------
  # OIDC to AWS — proves the trust setup works; doesn't push anything.
  # Real deploy steps go in the deploy workflow (ax-deploy).
  # ------------------------------------------------------------------
  aws-oidc-smoke:
    name: aws-oidc-smoke
    runs-on: ubuntu-latest
    if: vars.AWS_CI_ROLE_ARN != ''
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity
